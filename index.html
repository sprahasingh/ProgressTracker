<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff9f2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        const appearance = localStorage.getItem('progress-tracker-appearance') || 'system';
        const dark = appearance === 'dark' || (appearance === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        const themeColor = document.querySelector('meta[name="theme-color"]');
        const statusBarStyle = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (dark) document.documentElement.dataset.theme = 'dark';
        if (themeColor) themeColor.content = dark ? '#0b0b0d' : '#fff9f2';
        if (statusBarStyle) statusBarStyle.content = dark ? 'black-translucent' : 'default';
      } catch {}
    </script>
    <meta name="description" content="A calm, local-first space to build consistency and make progress on what matters." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/progress-tracker.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/progress-tracker.svg" />
    <title>ProgressTracker — make today count</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
